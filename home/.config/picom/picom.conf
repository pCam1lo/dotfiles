fading = true;
fade-in-step = 0.015;
fade-out-step = 0.1;
fade-delta = 5

experimental-backends = false;
backend = "glx";

vsync = false
refresh-rate = 0

detect-transient = true

# Dim unfocused windows slightly. Adjust inactive-opacity to taste.
inactive-opacity = 0.90;
active-opacity = 1.0;
inactive-opacity-override = false;
inactive-dim = 0.0;

focus-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Dunst'"
];

log-level = "warn";

opacity-rule = [
    "95:class_g = 'Org.gnome.Nautilus'"
];